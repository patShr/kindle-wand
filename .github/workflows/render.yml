name: Dashboard rendern

on:
  schedule:
    - cron: '5 * * * *' # stündlich; das Kindle holt sich das Bild nur 4× am Tag
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # für den Keepalive unten

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Der Runner hat Google Chrome schon an Bord. Nur falls nicht: Chromium laden
      # (dieser Download hing am 11.11. zehn Minuten und ließ den Lauf scheitern).
      - name: Browser
        timeout-minutes: 4
        run: |
          if [ -x /opt/google/chrome/chrome ]; then
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: Rendern
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          OUT_DIR: site/${{ secrets.DASH_PATH }}
        run: |
          test -n "$OUT_DIR" && test "$OUT_DIR" != "site/" || { echo "Secret DASH_PATH fehlt"; exit 1; }
          node src/render.js
          rm -f "$OUT_DIR/dashboard.html"
          touch site/.nojekyll
          echo '<!doctype html><title>.</title>' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Geplante Workflows in öffentlichen Repos werden nach 60 Tagen ohne Aktivität pausiert.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || true
